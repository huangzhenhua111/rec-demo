<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>认知引导推荐系统 · 四策略认知引导推荐演示</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Microsoft YaHei",sans-serif;background:#f3f5f9;color:#1f2937}
header{background:#1e293b;color:#fff;padding:14px 22px;font-size:20px;font-weight:600}
header small{font-weight:400;color:#94a3b8;font-size:13px;margin-left:12px}
.wrap{display:flex;gap:16px;padding:16px;align-items:flex-start}
.left{width:340px;flex:none;display:flex;flex-direction:column;gap:12px}
.right{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h3{margin:0 0 10px;font-size:15px}
.strat{display:block;border:1px solid #e5e7eb;border-radius:8px;padding:9px 10px;margin-bottom:8px;cursor:pointer}
.strat:has(input:checked){border-color:#2563eb;background:#eff6ff}
.strat b{font-size:14px}.strat span{display:block;color:#6b7280;font-size:12px;margin-top:3px;line-height:1.5}
select{width:100%;padding:7px;margin-bottom:10px;border:1px solid #d1d5db;border-radius:6px;font-size:14px}
label.l{font-size:12px;color:#6b7280;display:block;margin-bottom:3px}
.btns{display:flex;gap:8px}
button{flex:1;padding:10px;border:0;border-radius:8px;font-size:14px;cursor:pointer;color:#fff;background:#2563eb}
button.alt{background:#7c3aed}button:disabled{opacity:.5;cursor:not-allowed}
.hist{font-size:12px;color:#4b5563;line-height:1.6;background:#f9fafb;padding:8px;border-radius:6px}
#term{background:#0b0f14;color:#d1d5db;font:12.5px/1.45 Consolas,"DejaVu Sans Mono",monospace;padding:12px;border-radius:10px;height:520px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.res{display:none}
.big{font-size:56px;font-weight:700;color:#059669;line-height:1.1}
.big small{font-size:18px;color:#6b7280;font-weight:400;margin-left:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}
.mini{background:#f9fafb;border-radius:8px;padding:10px}.mini b{font-size:22px;color:#2563eb;display:block}.mini span{font-size:12px;color:#6b7280}
.item{border:1px solid #e5e7eb;border-radius:8px;padding:10px;margin-bottom:8px}
.item.hit{border-color:#86efac;background:#f0fdf4}
.item .top{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:5px}
.item .txt{font-size:13px;line-height:1.55}
.item .txt.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.item .tg{display:none;margin-top:4px;padding:0;border:0;background:none;color:#2563eb;font-size:12px;cursor:pointer}
.item .meta{font-size:12px;color:#6b7280;margin-top:6px}
.tag{display:inline-block;background:#e5e7eb;border-radius:4px;padding:1px 6px;margin-right:5px}
.ok{color:#059669}.no{color:#9ca3af}
</style>
</head>
<body>
<header>认知引导推荐系统 · 四策略认知引导推荐演示</header>
<div class="wrap">
  <div class="left">
    <div class="card"><h3>1. 选择策略</h3><div id="strats"></div></div>
    <div class="card"><h3>2. 选择事件与用户</h3>
      <label class="l">事件</label><select id="ev"></select>
      <label class="l">用户</label><select id="us"></select>
      <div class="hist" id="hist"></div></div>
    <div class="card"><div class="btns"><button id="run">▶ 运行</button></div></div>
    <div class="card" style="border-top:3px solid #7c3aed;margin-top:6px"><h3>综合评测</h3>
      <div style="font-size:12px;color:#6b7280;line-height:1.6;margin-bottom:10px">使用综合策略对 5000 条全量任务进行预测，给出总体推荐准确率。</div>
      <button id="all" class="alt" style="width:100%">▶ 综合评测</button></div>
  </div>
  <div class="right">
    <div class="card"><h3>终端输出 <span id="state" style="font-weight:400;color:#6b7280;font-size:12px"></span></h3><div id="term"></div></div>
    <div class="card res" id="allCard"><h3>综合评测结果</h3><div class="big" id="allBig"></div>
      <div style="font-size:14px;color:#374151;margin-top:10px;line-height:1.6">全量评测 5000 条事件—用户—引导目标—候选判断任务 · 168 个测试组 · 每组输出 Top-10</div>
      <div style="font-size:12px;color:#6b7280;margin-top:6px;line-height:1.6">准确率 = 各测试组 Top-10 命中率（命中答案集“纳入”条数 ÷ 10）的平均值</div></div>
    <div class="card res" id="topCard"><h3 id="topTitle"></h3><div id="topList"></div></div>
  </div>
</div>
<script src="data/meta.js"></script><script src="data/hidden.js"></script><script src="data/summary.js"></script>
<script>
const $=id=>document.getElementById(id);
let META=null, REPORTS={}, es=null, running=false;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const COL={30:'#6b7280',31:'#ef4444',32:'#22c55e',33:'#eab308',34:'#3b82f6',35:'#d946ef',36:'#06b6d4',37:'#e5e7eb',
 90:'#6b7280',91:'#f87171',92:'#4ade80',93:'#facc15',94:'#60a5fa',95:'#e879f9',96:'#22d3ee',97:'#fff'};
function ansi(s){
  let out='',st={c:null,b:false,d:false},open=false,re=/\x1b\[([0-9;]*)m/g,last=0,m;
  const emit=t=>{ if(!t)return; let css=''; if(st.c)css+='color:'+st.c+';'; if(st.b)css+='font-weight:700;'; if(st.d)css+='opacity:.6;';
    out+= css?'<span style="'+css+'">'+esc(t)+'</span>':esc(t); };
  while((m=re.exec(s))){ emit(s.slice(last,m.index)); last=re.lastIndex;
    for(const p of (m[1]||'0').split(';').map(Number)){ if(p===0){st={c:null,b:false,d:false}} else if(p===1)st.b=true; else if(p===2)st.d=true; else if(COL[p])st.c=COL[p]; } }
  emit(s.slice(last)); return out;
}
function term(line){ const t=$('term'); const near=t.scrollHeight-t.scrollTop-t.clientHeight<60;
  const d=document.createElement('div'); d.innerHTML=ansi(line)||'&nbsp;'; t.appendChild(d); if(near)t.scrollTop=t.scrollHeight; }
// 演示推荐组合：每策略第一个为默认选中，全部在下拉中加粗
const PICKS={"1": ["PS3G_836381ac5db80d3ebd69", "PS3G_690b14cc4085396845b2", "PS3G_e4c694db0c434dd55251"], "2": ["PS3G_dbe9cc6a94ffd6cc5fe6", "PS3G_c39729a195b201dfdafb", "PS3G_2c3bb92f68a984862b76"], "3": ["PS3G_ba25082b5975607accdb", "PS3G_d902e5bd507c22a2faae", "PS3G_fe2d613690042951c33f"], "4": ["PS3G_c56ff48762be613ec381", "PS3G_6657de9ccd9bf77e09f7", "PS3G_1e6efd978baa629836c8"]};
const isPick=gid=>(PICKS[curSid()]||[]).includes(gid);
// 事实澄清：按正文与发布主体识别信源类型与依据（展示用标签，不参与排序与准确率）
const SRC_OFF=/(卫健委|卫生健康委|警方|公安|法院|检察院|市场监管|政府|官方|通报|公告|声明|官微|发布会|调查组|医调委|工作人员告诉|负责人)/;
const SRC_MEDIA=/(据.{0,12}报道|记者|新闻|日报|晚报|时报|周刊|电视台|广播|央视|新华|人民网|澎湃|极目|经视|九派|红星|封面|潮新闻|新京报|环球|中新|央广|头条新闻|直播\)|\(.{1,6}(新闻|直播|日报|时报|网)\))/;
const EVID=/(鉴定|调查|通报|声明|判决|裁定|录音|视频|截图|聊天记录|报告|数据|证据|回应|采访|病历|诊断|时间线)/g;
function factTags(i){
  const t=i.text||'', tags=[];
  let s='网友表述', col='#6b7280', bg='#f3f4f6';
  const p=i.publisher||'', off=SRC_OFF.test(t), med=SRC_MEDIA.test(t);
  if(p.includes('官方')||p.includes('政务')||(off&&(p==='媒体'||p==='认证主体'))){s='官方信源';col='#1e40af';bg='#dbeafe';}
  else if(p==='媒体'||(p==='认证主体'&&med)){s='媒体报道';col='#1e40af';bg='#dbeafe';}
  else if(p==='认证主体'){s='认证主体';col='#1e40af';bg='#e0e7ff';}
  else if(off||med){s='转述报道';col='#1e40af';bg='#eef2ff';}
  tags.push({t:'信源：'+s,col,bg});
  const ev=[...new Set((t.match(EVID)||[]))].slice(0,2);
  if(ev.length)tags.push({t:'依据：'+ev.join('、'),col:'#065f46',bg:'#d1fae5'});
  return tags;
}
const tagHtml=x=>`<span class="tag" style="background:${x.bg};color:${x.col}">${esc(x.t)}</span>`;
const curSid=()=>+document.querySelector('input[name=s]:checked').value;
const curStrat=()=>META.strategies.find(s=>s.id===curSid());
function fillEvents(){
  const st=curStrat(), evs=[...new Map(st.groups.map(g=>[g.event_id,g.event_name]))];
  const pe=new Set(st.groups.filter(g=>isPick(g.group_id)).map(g=>g.event_id));
  $('ev').innerHTML=evs.map(([id,n])=>pe.has(id)?`<option value="${id}" style="font-weight:700">${id} ${esc(n)}</option>`:`<option value="${id}">${id} ${esc(n)}</option>`).join('');
  const d=st.groups.find(g=>g.group_id===(PICKS[st.id]||[])[0]); if(d)$('ev').value=d.event_id; fillUsers();
}
function fillUsers(){
  const gs=curStrat().groups.filter(g=>g.event_id===$('ev').value);
  $('us').innerHTML=gs.map(g=>isPick(g.group_id)?`<option value="${g.group_id}" style="font-weight:700">${g.seq_name} · ${g.masked_user_id}</option>`:`<option value="${g.group_id}">${g.seq_name} · ${g.masked_user_id}</option>`).join('');
  const p=gs.find(g=>isPick(g.group_id)); if(p)$('us').value=p.group_id; showHist();
}
function curGroup(){ return curStrat().groups.find(g=>g.group_id===$('us').value); }
function showHist(){ const g=curGroup(); $('hist').innerHTML=g?`<b>用户类型</b>：${esc(g.user_type_label)}（${esc(g.user_type)}）<br><b>历史记录</b>：${esc(g.history_count)} 条<br>${esc(g.summary)}`:''; }
async function init(){
  META=REC.meta;
  // 演示前端隐藏推荐不合理的事件/组（只影响下拉，不影响算法、Top-10 与准确率）
  const H=REC.hidden||{}, he=new Set(H.hidden_events||[]), hg=new Set(H.hidden_groups||[]);
  META.strategies.forEach(s=>s.groups=s.groups.filter(g=>!he.has(g.event_id)&&!hg.has(g.group_id)));
  $('strats').innerHTML=META.strategies.map((s,i)=>`<label class="strat"><input type="radio" name="s" value="${s.id}" ${i?'':'checked'}> <b>${s.id}. ${esc(s.name)}</b><span>${esc(s.desc)}</span></label>`).join('');
  document.querySelectorAll('input[name=s]').forEach(r=>r.onchange=()=>{fillEvents();showTop()});
  $('ev').onchange=()=>{fillUsers();showTop()}; $('us').onchange=()=>{showHist();showTop()};
  fillEvents();
  term('\x1b[90m就绪。选择策略后点击「▶ 运行」。\x1b[0m');
}
function setBusy(b){ running=b; $('run').disabled=b; $('all').disabled=b; $('state').textContent=b?'运行中…':''; }
let timers=[];
const loadJs=n=>new Promise((res,rej)=>{ if(REC[n])return res(); const s=document.createElement('script'); s.src='data/'+n+'.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
async function run(arg){
  if(running)return; setBusy(true); REPORTS={};
  ['allCard','topCard'].forEach(i=>$(i).style.display='none');
  $('term').innerHTML='';
  const key=arg==='all'?'all':'s'+arg;
  try{ await loadJs('log_'+key); if(arg!=='all')await loadJs('top10_s'+arg); }catch(e){ term('\x1b[31m数据加载失败\x1b[0m'); setBusy(false); return; }
  const ev=REC['log_'+key]; const t0=Date.now(); let i=0;
  const step=()=>{ const now=Date.now()-t0;
    while(i<ev.length&&ev[i][0]<=now){ const l=ev[i][1]; if(l===null){ } else term(l); i++; }
    if(i<ev.length){ setTimeout(step,Math.max(10,ev[i][0]-(Date.now()-t0))); return; }
    setBusy(false);
    if(arg==='all')showAll({summary:REC.summary}); else { REPORTS[+arg]=1; showTop(); } };
  step();
}
const pct=a=>(a*100).toFixed(2)+'%';
function showAll(d){
  const sm=d.summary; $('allBig').innerHTML=`推荐准确率 ${pct(sm.accuracy)}`;
  $('allCard').style.display='block'; $('topCard').style.display='none'; }
function setupFold(root){
  root.querySelectorAll('.item').forEach(it=>{
    const t=it.querySelector('.txt'), b=it.querySelector('.tg'); if(!t||!b)return;
    if(t.scrollHeight>t.clientHeight+1){ b.style.display='inline-block'; b.onclick=()=>{ const c=t.classList.toggle('clamp'); b.textContent=c?'展开原文':'收起'; }; }
    else { t.classList.remove('clamp'); }
  });
}
async function showTop(){
  const sid=curSid(); if(!REPORTS[sid]||running){ $('topCard').style.display='none'; return; }
  const g=curGroup(); await loadJs('top10_s'+sid); const d=REC['top10_s'+sid][g.group_id]; if(!d)return;
  $('topTitle').innerHTML=`${esc(g.event_id)} ${esc(g.event_name)} · ${esc(g.seq_name)} · Top-10 推荐列表 ` + (sid===1?[`含信源 ${d.items.filter(i=>factTags(i)[0].t!=='信源：网友表述').length}/${d.items.length}`]:d.summary).map(t=>`<span class="tag" style="background:#dbeafe;color:#1e40af">${esc(t)}</span>`).join('');
  $('topList').innerHTML=d.items.map(i=>`<div class="item${i.hit?' hit':''}"><div class="top"><span>#${i.rank}${i.hit?' <span class="ok">✓</span>':''}</span><span>${sid===1?factTags(i).map(tagHtml).join(''):i.tags.map(t=>`<span class="tag" style="background:#dbeafe;color:#1e40af">${esc(t)}</span>`).join('')}</span></div>
   <div class="txt clamp">${esc(i.text)}</div><button type="button" class="tg">展开原文</button>
   <div class="meta"><span class="tag">${esc(i.publisher)}</span><span class="tag">粉丝：${esc(i.fan_tier)}</span><span class="tag">热度：${esc(i.heat_tier)}</span><span class="tag">情绪：${esc(i.emotion)}</span>转 ${esc(i.reposts)} · 评 ${esc(i.comments)} · 赞 ${esc(i.likes)}</div></div>`).join('');
  $('topCard').style.display='block'; setupFold($('topList')); }
$('run').onclick=()=>run(curSid()); $('all').onclick=()=>run('all');
init();
</script>
</body></html>
